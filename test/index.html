<!DOCTYPE html>
<html lang="ch">

<head>
    <meta charset="UTF-8">
    <title>test</title>
</head>

<body>
    <h1 id="test">test</h1>
    <script>
        div = document.getElementById("test");
        const over = Date.now() + 1000 * 60;
        div.innerHTML = Math.floor((over - Date.now()) / 1000);
        requestAnimationFrame(function f() {
            const remaining = Math.floor((over - Date.now()) / 1000);
            if (remaining > 0){
                div.innerHTML = Math.floor((over - Date.now()) / 1000);
                requestAnimationFrame(f);
            } else {
                div.innerHTML = "over";
            }
            
        });
    </script>
</body>
<html>
